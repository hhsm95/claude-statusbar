# Shortcuts for https://taskfile.dev. Each task wraps an npm script, so package.json stays the
# single source of truth for how things are built and checked.
version: "3"

vars:
  PACKAGE: "@hhsm95/claude-statusbar"

tasks:
  default:
    desc: List the available tasks
    cmds:
      - task --list
    silent: true

  install:
    desc: Install dependencies from the lockfile
    cmds:
      - npm ci

  build:
    desc: Compile src/ to dist/
    cmds:
      - npm run build

  lint:
    desc: Run biome
    cmds:
      - npm run lint

  lint:fix:
    desc: Run biome and apply safe fixes
    cmds:
      - npx biome check --write .

  typecheck:
    desc: Type-check without emitting
    cmds:
      - npm run typecheck

  test:
    desc: Run the test suite
    cmds:
      - npm test

  check:
    desc: Lint, type-check and test (what CI runs)
    cmds:
      - npm run check

  link:
    desc: Build and expose this checkout as the global claude-statusbar command
    cmds:
      - task: build
      - npm link

  setup:
    desc: Link this checkout and point Claude Code's status line to it
    interactive: true
    cmds:
      - task: link
      - claude-statusbar init

  unlink:
    desc: Restore the previous status line and remove the global link
    interactive: true
    cmds:
      - claude-statusbar uninstall
      - npm unlink -g {{.PACKAGE}}
